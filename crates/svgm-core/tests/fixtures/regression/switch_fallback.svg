<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 462 352">
  <!-- draw.io: empty requiredFeatures branch, fallback link -->
  <switch>
    <g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/>
    <a transform="translate(0,-5)" xlink:href="https://www.diagrams.net/doc/faq/svg-export-text-problems" target="_blank">
      <text text-anchor="middle" font-size="10px" x="50%" y="100%">Viewer does not support full SVG 1.1</text>
    </a>
  </switch>
  <!-- Illustrator: foreignObject branch, then the real drawing -->
  <switch>
    <g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility">
      <foreignObject/>
    </g>
    <g>
      <rect width="10" height="10" fill="red"/>
      <circle cx="20" cy="20" r="5" fill="blue"/>
    </g>
  </switch>
</svg>
